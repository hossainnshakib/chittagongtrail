name: Build cPanel Standalone Artifact

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "prisma/**"
      - "public/**"
      - "server.js"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "postcss.config.mjs"
      - "proxy.ts"
      - ".github/workflows/cpanel-standalone-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: ctgtrail_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: https://chittagongtrail.com
      SITE_URL: https://chittagongtrail.com
      DATABASE_URL: mysql://root:rootpass@127.0.0.1:3306/ctgtrail_ci
      AUTH_SECRET: build-time-placeholder-secret
      ADMIN_EMAIL: admin@chittagongtrail.com
      ADMIN_PASSWORD_HASH: build-time-placeholder-hash
      CLOUDINARY_CLOUD_NAME: build-placeholder
      CLOUDINARY_API_KEY: build-placeholder
      CLOUDINARY_API_SECRET: build-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply CI migrations
        run: npx prisma db push --skip-generate

      - name: Build standalone app
        run: npx next build --webpack

      - name: Prepare artifact
        run: |
          mkdir -p cpanel-artifact/.next
          cp -R .next/standalone/. cpanel-artifact/
          cp -R .next/static cpanel-artifact/.next/static
          cp -R public cpanel-artifact/public
          cp -R prisma cpanel-artifact/prisma

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ctgtrail-cpanel-standalone
          path: cpanel-artifact
          retention-days: 3
